# windbreak four-process deployment skeleton (issue #15, SPEC S5.1-S5.2, S14).
#
# One service per SPEC process. Every service runs the same image and selects
# its process via `--process`. The services communicate only over the default
# network and the shared `ledger` volume; there is no custom `networks:` key.
# Only the dashboard publishes a port, and it is bound to loopback (SPEC S14:
# no public inbound).
#
# BUILD CONTEXT (issue #445). Compose resolves a relative build context against
# *this file's* directory, never the invoking shell's, so the previous
# `build: .` resolved to `deploy/` -- which holds no Dockerfile -- and
# `up -d` failed before a single container was created. The context is now
# `..` (the repo root) and the dockerfile is named explicitly. The compose file
# deliberately stays in `deploy/` so the documented
# `docker compose -f deploy/docker-compose.yml up -d` keeps working from the
# repo root and stays next to the systemd units it mirrors.
#
# PAPER ACTIVATION (issue #446). PAPER activates only when the mode ceiling
# permits it AND all four composition flags are supplied
# (`windbreak.main._paper_activated`); `pipeline` now supplies all four, so the
# ledger volume is actually written. The built-in SPEC S16 defaults already
# ship `mode_ceiling: paper`, so no `--config` is required and none is shipped:
# a config file that only restated the defaults would be a drift surface, not
# a safeguard.
#
# WHAT THIS DOES *NOT* CLAIM. Activating PAPER is not trading, and this stack
# places no order. Two independent reasons, both observed by bringing it up:
#   1. The shipped `deep_walk` fixture's only market is screened INELIGIBLE
#      every tick -- `ScreenDecisionRecorded {"eligible": false, "blocked_by":
#      ["min_depth_contract_centis", "horizon_days"]}` -- so the pipeline never
#      reaches forecasting at all.
#   2. Behind that, in cassette mode the research transports find nothing by
#      construction, so no forecast could clear verification anyway (#438).
# The ledger fills with ScreenDecisionRecorded, VerificationPassed (the risk
# kernel's cash/position reconciliation, not citation verification),
# EquitySampled, PositionsSnapshotRecorded and heartbeat records. That is a
# live, hash-chained, non-empty ledger -- and it is not a trade.
x-build: &build
  context: ..
  dockerfile: Dockerfile

services:
  pipeline:
    build: *build
    # Relative fixture paths resolve against the image WORKDIR, which holds a
    # copy of this repository -- the same invocation docs/RUNBOOK.md documents.
    command:
      - windbreak
      - run
      - --process
      - pipeline
      - --paper-books-dir
      - tests/fixtures/books/deep_walk
      - --cassette-path
      - tests/fixtures/forecast/cassettes.json
      - --ledger-path
      - /var/lib/windbreak/ledger/windbreak.db
      - --report-dir
      - /var/lib/windbreak/reports
    restart: on-failure
    volumes:
      - ledger:/var/lib/windbreak/ledger
      - reports:/var/lib/windbreak/reports

  riskkernel:
    build: *build
    command: ["windbreak", "run", "--process", "riskkernel"]
    restart: on-failure
    volumes:
      - ledger:/var/lib/windbreak/ledger

  order-gateway:
    build: *build
    command: ["windbreak", "run", "--process", "order_gateway"]
    restart: on-failure
    volumes:
      - ledger:/var/lib/windbreak/ledger

  dashboard:
    build: *build
    command: ["windbreak", "run", "--process", "dashboard"]
    restart: on-failure
    environment:
      # Never a literal: the token is interpolated from the operator's
      # environment, because config is hash-chained into the ledger and nothing
      # written there can ever be redacted. Compose's `:?` required-variable
      # form fails the whole invocation before a container exists, rather than
      # letting the dashboard exit 1 on the missing token and crash-loop under
      # `restart: on-failure` while `ps -a` reads as deployed (issue #446).
      WINDBREAK_DASHBOARD_TOKEN: ${WINDBREAK_DASHBOARD_TOKEN:?set WINDBREAK_DASHBOARD_TOKEN to the dashboard bearer token}
    # Dashboard reads the ledger without any trade authority (SPEC S5.1),
    # so its ledger mount is read-only. It therefore ships WITHOUT
    # `--ledger-path`: `_load_and_ledger_config` opens the ledger read-write
    # for any process given that flag, and `SqliteLedgerStore.__init__` runs
    # `PRAGMA journal_mode=WAL` plus a `CREATE TABLE`, so a read-only mount
    # raises `sqlite3.OperationalError: unable to open database file` at
    # startup. Until a read-only ledger open exists, the dashboard renders its
    # "no data yet" placeholders -- see the PR for #446.
    volumes:
      - ledger:/var/lib/windbreak/ledger:ro
    # Loopback-only publish: the dashboard accepts no public inbound (SPEC S14).
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  ledger:
  reports:
