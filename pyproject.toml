# pyproject.toml - Python project configuration

[project]
name = "windbreak"
version = "0.1.0"
description = "Open-source, locally hosted, always-on AI forecast trader for fully collateralized binary event markets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Geoff Gallinger" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.33.0",
]

[project.scripts]
windbreak = "windbreak.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["windbreak*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=windbreak",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
    "-p",
    "pytester",
    # The `container` tier is deselected by default (issue #466, epic #465).
    # Those tests need a docker daemon or a running systemd, so on a developer
    # machine they would only ever skip -- noise in every local run -- while in
    # CI they get a dedicated job that DOES have a daemon. Deselecting here and
    # selecting there keeps one marker meaning one thing in both places.
    #
    # This is a `-m` expression, and pytest takes the LAST `-m` it is given, so
    # an explicit `pytest -m container` (the CI job) and `pytest -m chaos` (the
    # chaos job) both override this line rather than intersecting with it.
    #
    # The `e2e` tier is deliberately NOT deselected: it spawns real windbreak
    # processes but needs no container runtime, so it stays inside the default
    # run and inside Gate 1. That is the point of splitting the tier by cost
    # rather than by importance.
    "-m",
    "not container",
]
markers = [
    "chaos: fault-injection chaos suite over the Order Gateway (SPEC §11.5); also selected standalone by the CI chaos job",
    "e2e: end-to-end tier (issue #466); spawns real windbreak processes, needs no container runtime, stays in the default run",
    "container: end-to-end tier needing a docker daemon or running systemd; deselected by default, run by the CI container job, and skipped -- never silently passed -- where the runtime is absent",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["windbreak"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
# Issue #179: `strict = true` is the single source of type-check strictness, so
# the config-driven `mypy windbreak/ scripts/` invocation in scripts/typecheck.sh
# (Gate 2 / check-all.sh) enforces exactly the same check set as the pre-commit
# hook's `--strict` args in .pre-commit-config.yaml. Previously this section
# hand-listed a *subset* of --strict's flags and conspicuously omitted
# `no_implicit_reexport`, so implicit re-export errors (the #158/#178 pattern)
# passed the local Gate-2 run yet failed CI's `--strict` pre-commit step -- the
# exact recurrence #179 targets. `strict = true` supersedes the individual flags
# (all of which it already implies) and the now-removed deprecated
# `strict_concatenate` (folded into --strict's `extra_checks`). Kept in lockstep
# with the hook's `--strict` by tests/toolchain/test_precommit_scope.py.
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "D1",     # pydocstyle: the "missing docstring" family -- see below
]
ignore = []

# THE DOCSTRING-COVERAGE GATE (issue #351)
#
# CLAUDE.md's Quality Standards table has always listed a docstring threshold
# next to line coverage, complexity and the rest. Nothing measured it. Neither
# pydocstyle nor interrogate was installed or dispatched, and `D` was absent
# from the select list above -- so the row was decoration: a documented gate
# that could not fail. That is the same defect class as issue #359 (a hook
# dispatched by no script) and issue #401 (18 of 26 hooks undispatched), found
# for the third time in the gate machinery itself.
#
# WHY RUFF, AND NOT pydocstyle OR interrogate
#
# The three names in circulation -- CLAUDE.md said "pydocstyle / ruff D rules",
# the ralph-documentation-specialist agent said "interrogate >=85%" -- are not
# three options so much as one implementation and two redundant packagings of
# it. Ruff REIMPLEMENTS pydocstyle's rule set natively as the `D` family, and
# ruff is already the pinned linter (constraints-quality.txt), already the
# single formatter authority (ADR-0002), already dispatched by scripts/lint.sh
# AND by the ruff-check pre-commit hook that Gate 1 now runs in full (#401).
# Adding pydocstyle or interrogate would mean a new pin, a new hook, a new
# gate script and a second tool's opinion to keep in lockstep -- to measure
# what the tool already in the toolchain measures. So: ruff, no new dependency.
#
# WHY D1 (PRESENCE), AND WHAT THAT DOES TO THE NUMBER
#
# `D1` is exactly the "missing docstring" family, D100-D107: module, class,
# method, function, package, magic method, nested class, `__init__`. It is
# precisely what "docstring coverage" names, and it enforces PRESENCE per
# symbol -- i.e. 100%, with no percentage to hide behind.
#
# That is STRICTER than the >=95% the docs claimed, not looser. A percentage
# threshold is what you reach for when 100% is out of reach; it buys headroom
# at the cost of letting a fixed fraction of symbols silently lose their
# docstrings while the meter still reads green. This repo does not need that
# headroom: at the time this gate was wired, `windbreak/`, `scripts/` and
# `plans/` were ALREADY at 100% presence, and every one of the 129 findings
# was an undocumented test function in eight files -- all written, not
# ignored, in the same change. So the honest wiring is the strict one, and
# CLAUDE.md's row was corrected to state the rule actually enforced rather
# than a percentage no tool computes.
#
# WHAT IS DELIBERATELY *NOT* ENABLED, AND WHY IT IS NOT A BLANKET IGNORE
#
# The rest of the `D` family (D2xx/D3xx/D4xx) governs docstring FORMATTING and
# CONTENT -- blank line after summary, terminal punctuation, capitalisation --
# not coverage. Selecting all of `D` reports ~1,900 further findings here,
# dominated by 1,667 D205 (multi-line summaries). Those are a real style
# question, but they are a DIFFERENT question from the documented gate, and
# reflowing 1,667 docstrings would bury this change. Tracked as a follow-up
# (see the PR for issue #351) rather than silenced: nothing here suppresses a
# finding the documented gate asks for.
# WHY THERE IS NO SECOND LINTER, AND WHY `PL` IS NOT SELECTED (issue #411)
#
# CLAUDE.md's Quality Standards table used to assert `Pylint Score >= 9.0`.
# Pylint was in no pin, no requirements file, no pre-commit hook and no gate
# script; it was not importable and had no pinned version anywhere. The row was
# decoration -- the fourth instance of that defect class found in the gate
# machinery itself, after #359, #401 and #351 -- and the worst-behaved, because
# ">=9.0 pylint" was quoted as a hard constraint in agent briefs written from
# the table. The row is gone. Two reasons it was not wired instead:
#
# 1. THE SCORE IS NOT A QUALITY PROPERTY. Pylint's 10-point score is a weighted
#    aggregate over its own message counts, normalised by statement count. No
#    other tool computes it, so the number is unreproducible except by adopting
#    pylint wholesale. Worse, unlike every other row in that table -- each a
#    floor or a per-item obligation -- a score threshold is a TOLERANCE: a
#    codebase can sit at 9.2 with any individual defect present indefinitely,
#    and can lose the gate by growing rather than by regressing. That is the
#    opposite of how this repo gates, which is per-rule and absolute.
#
# 2. RUFF ALREADY IMPLEMENTS PYLINT'S RULES. They ship natively as the `PL`
#    family (PLC/PLE/PLR/PLW). So the choice was never "pylint or no pylint
#    checks"; it was "select PL, or not" -- and installing pylint would add a
#    second, separately-versioned opinion on rules the pinned linter already
#    has. This is the same call PR #409 made in declining pydocstyle and
#    interrogate when ruff already implemented the `D` family, and the same
#    instinct as ADR-0002's single formatter authority.
#
# WHAT SELECTING `PL` WOULD COST, MEASURED, NOT GUESSED
#
# `ruff check --select PL` over windbreak/, scripts/ and tests/ reports 1,919
# findings. The distribution is the argument:
#
#   886  PLR2004  magic-value-comparison      (overwhelmingly test assertions)
#   840  PLC0415  import-outside-top-level    (deliberate: deferred imports)
#   173  PLR0913  too-many-arguments
#     9  PLC0414  useless-import-alias
#     4  PLR0402  manual-from-import
#     2  PLR0911  too-many-return-statements
#     2  PLW0108  unnecessary-lambda
#     1  each     PLC0207, PLR0915, PLR1714
#
# The `PLE` tier -- pylint's ERROR class, the findings that indicate a genuine
# defect rather than a style preference -- is EMPTY. What remains is either a
# style question (PLR2004 against test literals, PLC0415 against imports this
# codebase defers on purpose) or a complexity opinion that overlaps the xenon
# ceiling already enforced by scripts/complexity.sh (PLR0913/PLR0911/PLR0915).
#
# So there is no pylint-only correctness gap here, and the ~30 non-duplicated
# nits (PLC0414, PLR0402, PLW0108, PLC0207, PLR1714) are worth a follow-up on
# their own merits -- not worth carrying a phantom score threshold for. They
# are tracked as a follow-up rather than silenced: nothing here suppresses a
# finding any documented gate asks for.
[tool.ruff.lint.pydocstyle]
# CLAUDE.md's "Docstring Style (Google Format)" section is the house standard,
# so the convention is declared even though no D1xx rule is convention-
# dependent. It is what makes widening `D1` to `D` a config-only change with
# the right rules already excluded, instead of an invitation to re-litigate.
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # Allow assert in tests

[tool.ruff.lint.pep8-naming]
# ``http.server.BaseHTTPRequestHandler`` dispatches to ``do_<COMMAND>`` methods
# by name, so ``do_GET``/``do_POST`` are mandated by the stdlib contract, not a
# style choice. Likewise ``ast.NodeVisitor`` dispatches to ``visit_<NodeType>``
# methods by name, so the capitalised node-type suffixes below are stdlib
# dispatch method names (used by scripts/lint_no_floats.py's FLOAT-003 pass) --
# enumerated exactly rather than globbed.
extend-ignore-names = [
    "do_GET",
    "do_POST",
    "visit_BinOp",
    "visit_AugAssign",
    "visit_Assign",
    "visit_AnnAssign",
    "visit_For",
    "visit_AsyncFor",
    "visit_FunctionDef",
    "visit_AsyncFunctionDef",
    "visit_ClassDef",
    "visit_ListComp",
    "visit_SetComp",
    "visit_DictComp",
    "visit_GeneratorExp",
    "visit_Lambda",
    "visit_With",
    "visit_AsyncWith",
    "visit_NamedExpr",
    "visit_ExceptHandler",
    "visit_MatchAs",
    "visit_MatchStar",
    "visit_MatchMapping",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", "virtualenv"]

[tool.mutmut]
# mutmut 3.x config surface (issue #324). The 2.x keys this replaces:
#   paths_to_mutate -> source_paths           (and it must be a LIST: 3.x does
#                                              [Path(p) for p in <value>], so the
#                                              old bare string would iterate
#                                              characters, not paths)
#   tests_dir       -> pytest_add_cli_args_test_selection
#   runner          -> pytest_add_cli_args    (3.x always drives pytest itself,
#                                              so only the extra args carry over)
#   backup          -> removed; 3.x mutates into a ./mutants/ tree rather than
#                      rewriting sources in place, so there is nothing to back up.
source_paths = ["windbreak/"]
# --no-cov is required, not cosmetic. pytest addopts in this file carry
# --cov=windbreak --cov-fail-under=90, and mutmut runs the suite once per
# mutant, usually stopping at the first failure (--exitfirst). Under those
# partial runs coverage lands far below 90%, so every run -- including mutmut's
# initial clean baseline -- exits non-zero on the coverage gate and mutmut
# concludes it cannot establish a baseline ("Failed to run clean test"), leaving
# every mutant unchecked. Coverage is enforced by check-all.sh; the mutation
# gate measures a different thing and must not re-enforce it.
pytest_add_cli_args = ["--exitfirst", "--quiet", "--tb=no", "--no-cov"]
# Behavioural tests only. The repo-governance suites are deselected because a
# mutant in windbreak/ can never be killed by them -- they assert facts about
# repo FILES (pins, docs, import contracts, script contents), not about the
# behaviour of the mutated code -- so running them costs time per mutant and
# buys no signal. Under mutmut 3.x they are also actively broken: the suite runs
# inside ./mutants/, so each needs its inputs mirrored via also_copy, and
# test_full_scan_mode_real_repo_denylisted_packages_are_clean cannot be fixed
# that way at all -- it scans the real source tree, which in ./mutants/ is
# deliberately mutated, so it fails by construction.
#
# NOTE: this narrows what the release gate executes. It does not lower the
# threshold, and it cannot mask a surviving windbreak/ mutant, but it is a
# deliberate scoping decision on an owner-directive gate (issue #107).
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/toolchain",
    "--ignore=tests/architecture",
    "--ignore=tests/docs",
    "--ignore=tests/scripts",
    "--ignore=tests/numeric/test_float_lint.py",
]
# mutmut 2.x mutated sources in place, so the whole repo was on hand when the
# suite ran. 3.x runs the suite inside an isolated ./mutants/ tree containing
# only source_paths plus also_copy (which already covers tests/, pyproject.toml
# and the lockfiles). Anything else the suite reads from the repo root must be
# listed here or collection dies before a single mutant is judged:
#   scripts/  -- tests/scripts/* load these modules by path (e.g.
#                tests/scripts/test_run_canaries.py imports scripts/run_canaries.py)
#   docs/     -- referenced by a docs-drift test
#   the root config files + .github/ -- tests/toolchain/* resolve them relative
#                to the tree root, which under mutmut 3.x is ./mutants/
also_copy = [
    "scripts/",
    "docs/",
    "deploy/",
    "plans/",
    ".github/",
    "Dockerfile",
    "prompts/",
    "ACCOUNTING.md",
    "ARCHITECTURE.md",
    "CLAUDE.md",
    "EVALUATION.md",
    "LEGAL_AND_COMPLIANCE.md",
    "OPERATOR_WARNINGS.md",
    "README.md",
    "RUNBOOK.md",
    "SECURITY.md",
    "constraints-quality.txt",
    "requirements.txt",
    "requirements-dev.txt",
    ".pre-commit-config.yaml",
]
