name: "Scan: Performance sweep"

# Thin wrapper over the reusable _claude-scan.yml core. N+1 queries, missing indexes, sync-in-async, unmemoized RN renders, bundle regressions.
#
# Clone of scan-todo.yml; see it and _claude-scan.yml for the full rationale
# (auth, permissions, SHA-pinned actions, the scan-issue-writer contract).
# workflow_dispatch is REQUIRED on every scan wrapper — it is the hook the
# queue-depth hopper uses to refill the Ralph backlog off-schedule.

on:
  # PAUSED 2026-08-08 by the MVP priority audit
  # (plan/2026-08-08_MVP_PRIORITY_AUDIT.md §5, §7).
  #
  # The PAPER loop currently processes one fixture market per tick and can
  # never fill, so this scanner optimizes code paths the running product does
  # not reach — six of its issues were open and unstarted when it was paused.
  # It is also removed from hopper.yml's low-runway dispatch rotation; pausing
  # the cron alone would not have stopped it.
  #
  # RESTORE when the MVP critical path (audit Tier A: #339, #340, #342, #343,
  # #344) has closed — real data volume makes these findings real, and #319
  # (11x ledger rescan) and #332 (per-request bundle rebuild) should be
  # re-promoted at that point. Re-add to the hopper rotation at the same time.
  #
  # schedule:
  #   - cron: "0 8 * * 4"     # weekly Thursday 08:00 UTC
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Hard cap on issues created this run."
        required: false
        default: "5"

# A called reusable workflow can never receive MORE GITHUB_TOKEN scope than its caller grants; _claude-scan.yml needs id-token:write for the Claude action's OIDC auth exchange, and id-token is never in the default token — omitting this block makes GitHub fail the run at startup with no logs (the observed startup_failure).
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_claude-scan.yml
    with:
      scan_name: perf
      max_issues: ${{ fromJSON(github.event.inputs.max_issues || '5') }}
      # P3 (was P2) per the 2026-08-08 MVP priority audit: perf findings sit
      # below the MVP critical path until real data volume exists, so an
      # on-demand run must not refill the tier the Ralph picker reads first.
      priority: P3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
