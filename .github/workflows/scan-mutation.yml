name: "Scan: Mutation survivors"

# Thin wrapper over the reusable _claude-scan.yml core. mutmut/Stryker survivors on the hottest modules, each with the killing assertion.
#
# Clone of scan-todo.yml; see it and _claude-scan.yml for the full rationale
# (auth, permissions, SHA-pinned actions, the scan-issue-writer contract).
# workflow_dispatch is REQUIRED on every scan wrapper — it is the hook the
# queue-depth hopper uses to refill the Ralph backlog off-schedule.

on:
  # PAUSED 2026-08-08 by the MVP priority audit
  # (plan/2026-08-08_MVP_PRIORITY_AUDIT.md §5, §7).
  #
  # Mutation score is the documented MANUAL pre-v1.0.0 release gate (issue
  # #107, CLAUDE.md) — never an automated gate — so this scanner's output can
  # only ever compete with MVP work for the Ralph picker's attention. Ten of
  # its issues were already open and unstarted when it was paused.
  #
  # RESTORE when the MVP critical path (audit Tier A: #339, #340, #342, #343,
  # #344) has closed, by uncommenting the schedule below. `workflow_dispatch`
  # stays enabled so the gate can still be run on demand before a release.
  #
  # schedule:
  #   - cron: "0 8 8,22 * *"     # biweekly (8th & 22nd) 08:00 UTC — expensive, schedule-only (never hopper)
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Hard cap on issues created this run."
        required: false
        default: "8"

# A called reusable workflow can never receive MORE GITHUB_TOKEN scope than its caller grants; _claude-scan.yml needs id-token:write for the Claude action's OIDC auth exchange, and id-token is never in the default token — omitting this block makes GitHub fail the run at startup with no logs (the observed startup_failure).
permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_claude-scan.yml
    with:
      scan_name: mutation
      max_issues: ${{ fromJSON(github.event.inputs.max_issues || '8') }}
      priority: P3
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
