name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# PR runs: a new push to the same PR cancels the superseded run (stale-head
# dedup). Push runs (main/develop): NEVER cancelled or queue-replaced — each
# gets a unique per-run group. Sharing one cancelable group per ref meant
# Ralph's post-merge `record completion` push (~15s after every squash merge)
# cancelled the merge commit's run, so every merge landed on main with 5
# cancelled jobs and no verification while the branch looked green.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIN_COVERAGE: 90
  MIN_BRANCH_COVERAGE: 85
  PYTHON_VERSION_PRIMARY: "3.12"

# NOTE: Mutation testing is intentionally NOT run here. Per the owner directive
# in issue #107 it is a MANUAL pre-v1.0.0 release gate — see
# .github/workflows/mutation-gate.yml (workflow_dispatch only).

jobs:
  quality:
    name: Quality Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints-quality.txt -r requirements.txt
          pip install -c constraints-quality.txt -r requirements-dev.txt
          pip install -e . -c constraints-quality.txt

      # This step runs the WHOLE pre-commit hook set, via scripts/precommit.sh
      # (issue #401) — every hook in .pre-commit-config.yaml over --all-files,
      # skipping no-commit-to-branch by name for the reason recorded in issue
      # #127: actions/checkout attaches HEAD to main on push-event runs, so the
      # hook would fail on every merge, a category error given the commit
      # already passed its PR gates.
      #
      # A standalone "Pre-commit (all files)" step used to run that identical
      # invocation a second time, per matrix leg — 18s/29s/27s on the
      # 3.11/3.12/3.13 legs, 74s of runner time per PR for zero additional
      # hooks. It was removed in issue #406. CI's hook set is now Gate 1's by
      # construction, and one skip list exists in the repo instead of two that
      # have to agree. tests/toolchain/test_precommit_gate_coverage.py pins
      # both halves: that this step exists, and that nothing re-adds the
      # duplicate.
      - name: Quality gate (identical to local)
        run: ./scripts/check-all.sh

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.PYTHON_VERSION_PRIMARY
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports
        if: matrix.python-version == env.PYTHON_VERSION_PRIMARY
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .coverage
            pytest.xml
          retention-days: 30

  chaos:
    name: Chaos Suite (SPEC §11.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints-quality.txt -r requirements.txt
          pip install -c constraints-quality.txt -r requirements-dev.txt
          pip install -e . -c constraints-quality.txt

      - name: Chaos suite (fault-injection invariants)
        # This is NOT a gate weakening. --no-cov disables coverage collection
        # AND the --cov-fail-under=90 enforcement for THIS job only; the 90%
        # full-suite coverage gate is still enforced by the `quality` job,
        # where the chaos tests also run and contribute their coverage. This
        # `chaos` job is an isolated, merge-gating FUNCTIONAL signal that fails
        # the build on any SPEC §11.5 invariant breach. --strict-markers /
        # --strict-config stay active (we deliberately avoid --override-ini /
        # -o addopts=, which would silently drop them).
        run: pytest -m chaos --no-cov -v

  container:
    # THE QUOTES BELOW ARE LOAD-BEARING. DO NOT REMOVE THEM (issue #509).
    #
    # In YAML a `#` preceded by whitespace opens a comment inside an UNQUOTED
    # scalar. Written bare, `End-to-End Container Tier (epic #465)` parses as
    # `End-to-End Container Tier (epic` -- dangling paren and all -- and the
    # rest is discarded. Measured, not inferred: `gh api
    # .../actions/runs/<id>/jobs` reported the check run under that truncated
    # string, and `job.name` is what GitHub matches required status checks
    # against. So the truncation did not merely make the log look odd; it set
    # what the merge gate on `main` means.
    #
    # This job's name IS a required status check context. Renaming it -- by
    # editing the string, or by dropping these quotes, which is a rename that
    # does not look like one -- without renaming the protection entry to match
    # leaves `main` requiring a context no job will ever report, and EVERY
    # pull request blocks forever with all checks green and nothing to point
    # at. That was observed live on PRs #503 and #508. The protection setting
    # is not editable from a pull request, so the two halves move in this
    # order and no other: (1) the repo owner drops the stale context from
    # branch protection, (2) the rename merges, (3) the owner re-adds the
    # context under the new name. The pull request is BLOCKED between (1) and
    # (3); that is the sequence working, not a failure.
    #
    # Two guards hold this, and they cover different things:
    #   - tests/toolchain/test_workflow_scalar_truncation.py fails if ANY
    #     `name:`/`if:` under .github/workflows/ is truncated by a `#` again.
    #     It runs everywhere, including CI.
    #   - tests/e2e/test_tier_selection_contract.py compares this name against
    #     the LIVE required-context list and fails if they disagree in either
    #     direction. Reading branch protection needs an admin-scoped token, so
    #     that one asserts locally and skips loudly in CI.
    name: "End-to-End Container Tier (epic #465)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION_PRIMARY }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints-quality.txt -r requirements.txt
          pip install -c constraints-quality.txt -r requirements-dev.txt
          pip install -e . -c constraints-quality.txt

      - name: "Build the distribution the wheel tier installs (issue #467)"
        # tests/e2e/test_installed_wheel.py asserts on the WHEEL, in a clean
        # virtualenv -- not on the checkout. It therefore needs `dist/` to hold
        # exactly one wheel before pytest starts. The `build` job below produces
        # its own copy for `twine check` and the release artifact; duplicating
        # ~10s of `python -m build` here is cheaper than making this job wait on
        # that one, which would put a second job on the critical path of every
        # merge to serialise two things that have no real dependency.
        run: |
          pip install build
          python -m build --outdir dist
          ls -l dist/

      - name: Report the runtimes this job actually has
        # Printed, not asserted. This job's tests skip where a runtime is
        # absent, so a silent skip would otherwise read as a pass; this line is
        # what makes the log answer "did it really run?" without opening the
        # test output. WINDBREAK_E2E_REQUIRE_RUNTIME below is the enforcement
        # that goes with it.
        run: |
          docker info --format 'docker daemon: {{.ServerVersion}}' || echo 'docker daemon: UNAVAILABLE'
          test -d /run/systemd/system && echo 'systemd: running' || echo 'systemd: NOT running'
          command -v systemd-analyze >/dev/null && echo 'systemd-analyze: present' || echo 'systemd-analyze: absent'
          ls dist/*.whl >/dev/null 2>&1 && echo "built wheel: $(ls dist/*.whl)" || echo 'built wheel: ABSENT'
          echo "fail-closed on a missing runtime: WINDBREAK_E2E_REQUIRE_RUNTIME=1"

      - name: Container tier (docker / systemd end-to-end)
        # This is NOT a gate weakening, and it is the same reasoning the chaos
        # job above records. --no-cov disables coverage collection AND the
        # --cov-fail-under=90 enforcement for THIS job only. The tier exercises
        # windbreak in CHILD processes and containers, whose lines the parent's
        # collector cannot see, so a marker-filtered run would report near-zero
        # and fail the coverage gate on a perfectly green run.
        #
        # NOTE, corrected in review of PR #477: unlike the `chaos` tests above,
        # the `container` tests do NOT also run in the `quality` job --
        # pyproject's addopts carry `-m "not container"` and check-all.sh never
        # overrides that selection, so they are deselected there. This job is
        # the only place they execute. That costs nothing in coverage terms,
        # because they shell out to docker/systemd and execute no `windbreak`
        # package code, so the 90% floor the `quality` job enforces is measured
        # over exactly the same lines either way. The earlier wording was
        # copy-pasted from the chaos job, where the claim IS true.
        #
        # `-m container` overrides the `-m "not container"` in pyproject
        # addopts, because pytest takes the LAST -m it is given. --strict-markers
        # and --strict-config stay active (we deliberately avoid --override-ini
        # and -o addopts=, which would silently drop them).
        env:
          # THE SKIP HAZARD, decided deliberately (issues #467, #468). This job
          # is a REQUIRED check under branch protection, and a required check
          # that skips reports success — the CI-level form of a corpus scan
          # asserting over zero hits. Locally a skip is right: not every
          # developer has a docker daemon, and a tier that errored there would
          # simply be deleted. Here the runtimes are provisioned deliberately,
          # so a missing one means the provisioning broke and the gate quietly
          # stopped gating. This flag makes `tests.e2e.harness.require_runtime`
          # FAIL instead of skip, naming what was missing.
          WINDBREAK_E2E_REQUIRE_RUNTIME: "1"
        run: pytest -m container --no-cov -v

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages
        run: |
          python -m build

      - name: Check distribution packages
        run: |
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 30
