name: Mutation Gate (manual pre-v1.0.0)

# Mutation testing is the PRE-RELEASE quality gate, run MANUALLY before a
# v1.0.0 ship — never on push/PR/schedule. It was removed from automated CI
# per the owner directive tracked in issue #107 (mutmut must never fail an
# automated run while the project is far from v1.0.0). Trigger it on demand:
#
#   gh workflow run mutation-gate.yml
#
# or via the Actions tab "Run workflow" button.
#
# REVIVAL NOTE — RESOLVED by issue #324. Both prerequisites this note listed
# are now done: `[tool.mutmut]` in pyproject.toml is migrated to the 3.x schema
# (list-valued `source_paths` / `pytest_add_cli_args_test_selection`), mutmut is
# pinned to 3.7.0 in constraints-quality.txt, and the score parsing moved off
# `mutmut results` prose onto the machine-readable
# `mutants/mutmut-cicd-stats.json` that 3.x `export-cicd-stats` emits.
#
# The scoring logic is NOT duplicated here any more. This job now calls
# `scripts/mutation.sh`, the one implementation of the gate, so the workflow and
# a local run cannot drift apart or disagree on a release decision (DRY). The
# steps this replaced were broken three ways under 3.x beyond the stale parsing:
# `--paths-to-mutate=` is no longer a CLI flag (config-only), `mutmut html` no
# longer exists, and the `html/` artifact it uploaded is never produced.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_MUTATION_SCORE: 80
  PYTHON_VERSION_PRIMARY: "3.12"

jobs:
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_PRIMARY }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -c constraints-quality.txt -r requirements.txt
          pip install -c constraints-quality.txt -r requirements-dev.txt
          pip install -c constraints-quality.txt pytest mutmut

      # One implementation of the gate, invoked here and locally. scripts/mutation.sh
      # runs mutmut, exports the 3.x CI/CD stats JSON, computes the score, and
      # fails CLOSED on an interrupted, incomplete, or zero-mutant run -- so a
      # misconfigured mutmut can no longer report success. Its exit code IS the
      # gate result, so this step deliberately does not swallow failures.
      - name: Run mutation gate
        run: ./scripts/mutation.sh --min-score "${MIN_MUTATION_SCORE}"

      - name: Upload mutation stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-test-results
          path: mutants/mutmut-cicd-stats.json
          retention-days: 30
          if-no-files-found: warn
